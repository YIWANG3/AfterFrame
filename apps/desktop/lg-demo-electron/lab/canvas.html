<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>概念 A · 全景画布</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#0b0b0d; color:#f0f0f0; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
    font-size:13px; -webkit-font-smoothing:antialiased;
  }
  .glass {
    background:rgba(19,19,23,.55);
    backdrop-filter:blur(24px) saturate(1.5);
    box-shadow:0 12px 32px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.09);
  }
  svg.ic { width:17px; height:17px; stroke:currentColor; stroke-width:1.7; fill:none;
    stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }

  /* ── 左侧极简图标轨 ── */
  #rail {
    position:fixed; left:14px; top:50%; transform:translateY(-50%); z-index:40;
    width:52px; border-radius:26px; padding:12px 0;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  #rail button {
    width:38px; height:38px; border:none; border-radius:19px; background:transparent;
    color:rgba(240,240,240,.55); cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .12s, color .12s;
  }
  #rail button:hover { background:rgba(255,255,255,.09); color:#f0f0f0; }
  #rail button.on { background:rgba(210,160,90,.18); color:#d2a05a; }
  #rail .gap { height:10px; }

  /* ── 顶部浮层:裸标题 + 胶囊岛 ── */
  #top {
    position:fixed; top:0; left:92px; right:20px; z-index:40; height:72px;
    display:flex; align-items:center; gap:14px; pointer-events:none;
  }
  #top > * { pointer-events:auto; }
  .title { text-shadow:0 1px 16px rgba(0,0,0,.9); }
  .title h1 { font-size:21px; font-weight:650; letter-spacing:.2px; }
  .title p { font-size:11.5px; color:rgba(240,240,240,.55); margin-top:2px; }
  .seg {
    margin-left:auto; display:flex; padding:3px; border-radius:999px; height:36px;
  }
  .seg button {
    border:none; background:transparent; color:rgba(240,240,240,.6); font:inherit; font-size:12.5px;
    padding:0 16px; border-radius:999px; cursor:pointer; transition:background .14s,color .14s;
  }
  .seg button.on { background:rgba(255,255,255,.14); color:#fff; font-weight:500; }
  .search {
    display:flex; align-items:center; gap:8px; height:36px; border-radius:999px;
    padding:0 14px; width:230px; color:rgba(240,240,240,.5);
  }
  .search input {
    flex:1; background:none; border:none; outline:none; color:#f0f0f0;
    font:inherit; font-size:12.5px; min-width:0;
  }
  .search input::placeholder { color:rgba(240,240,240,.35); }
  .btn-import {
    height:36px; border:none; border-radius:999px; padding:0 16px; cursor:pointer;
    background:rgba(210,160,90,.92); color:#1a1206; font:inherit; font-size:12.5px; font-weight:600;
    display:flex; align-items:center; gap:6px; box-shadow:0 8px 24px rgba(210,160,90,.25);
    transition:transform .12s;
  }
  .btn-import:active { transform:scale(.96); }

  /* ── 照片全幅画布 ── */
  #canvas { position:absolute; inset:0; overflow-y:auto; padding:80px 20px 96px 88px;
    scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.18) transparent; }
  #canvas::-webkit-scrollbar { width:8px; }
  #canvas::-webkit-scrollbar-thumb { background:rgba(255,255,255,.15); border-radius:4px; }
  .row { display:flex; gap:5px; margin-bottom:5px; }
  .tile { position:relative; overflow:hidden; border-radius:7px; cursor:pointer; flex-grow:1; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; transition:filter .14s; }
  .tile:hover img { filter:brightness(1.09); }
  .tile.sel::after {
    content:""; position:absolute; inset:0; border-radius:inherit;
    box-shadow:inset 0 0 0 2.5px #d2a05a;
  }

  /* ── 底部缩放胶囊 ── */
  #zoom {
    position:fixed; right:20px; bottom:18px; z-index:40; height:38px; border-radius:999px;
    display:flex; align-items:center; gap:10px; padding:0 16px; color:rgba(240,240,240,.6);
  }
  #zoom input { width:96px; accent-color:#d2a05a; }
  #count {
    position:fixed; left:88px; bottom:18px; z-index:40; height:32px; border-radius:999px;
    display:flex; align-items:center; padding:0 14px; font-size:11.5px; color:rgba(240,240,240,.6);
  }

  /* ── 灯箱 ── */
  #lb { position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
    background:rgba(5,5,7,.88); backdrop-filter:blur(16px); }
  #lb.open { display:flex; }
  #lb img { max-width:88vw; max-height:88vh; border-radius:8px; box-shadow:0 30px 90px rgba(0,0,0,.6); }
  #lb .x { position:fixed; top:18px; right:18px; width:40px; height:40px; border-radius:50%; border:none;
    color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>

<div id="canvas"></div>

<nav id="rail" class="glass">
  <button class="on" title="照片"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m5 19 5.5-5.5 3 3L17 13l4 4"/></svg></button>
  <button title="人物"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg></button>
  <button title="地图"><svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg></button>
  <button title="收藏"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20.5 4.5 13a4.8 4.8 0 0 1 0-6.8 4.8 4.8 0 0 1 6.8 0l.7.7.7-.7a4.8 4.8 0 0 1 6.8 6.8Z"/></svg></button>
  <button title="贴纸"><svg class="ic" viewBox="0 0 24 24"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v13H6Z"/></svg></button>
  <div class="gap"></div>
  <button title="设置"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.06-.4.1-.8.1-1.2Z"/></svg></button>
</nav>

<header id="top">
  <div class="title">
    <h1>图库</h1>
    <p>main.afcatalog · 1,247 张照片</p>
  </div>
  <div class="seg glass">
    <button>年份</button><button>月份</button><button class="on">所有照片</button>
  </div>
  <div class="search glass">
    <svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input placeholder="搜索照片、相机、地点">
  </div>
  <button class="btn-import">
    <svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>导入
  </button>
</header>

<div id="count" class="glass">已选 0 张</div>
<div id="zoom" class="glass">
  <span style="font-size:15px">−</span><input type="range" min="150" max="330" value="230" id="zr"><span style="font-size:14px">+</span>
</div>

<div id="lb"><img id="lbi" src="" alt=""><button class="x glass" onclick="lb.classList.remove('open')">
  <svg class="ic" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
</div>

<script>
const P = [
  ['p01.jpg',1.506],['p02.jpg',1.300],['p03.jpg',1.497],['p04.jpg',1.479],
  ['p05.jpg',1.295],['p06.jpg',1.433],['p07.jpg',1.527],['p08.jpg',1.361],
  ['p09.jpg',1.302],['p10.jpg',1.499],['p11.jpg',1.348],['p12.jpg',1.176],
];
const canvas = document.getElementById('canvas');
const lb = document.getElementById('lb');
const lbi = document.getElementById('lbi');
let rowH = 230, selCount = 0;
function render() {
  canvas.innerHTML = '';
  const avail = canvas.clientWidth - 108;
  let row = null, acc = 0;
  for (let k = 0; k < 3; k++) for (let i = 0; i < P.length; i++) {
    if (!row || acc > avail / rowH) {
      row = document.createElement('div'); row.className = 'row';
      row.style.height = rowH + 'px'; canvas.appendChild(row); acc = 0;
    }
    const [src, ar] = P[i];
    const t = document.createElement('div');
    t.className = 'tile'; t.style.flexBasis = (ar * rowH) + 'px'; t.style.aspectRatio = ar;
    t.innerHTML = `<img src="../photos/${src}" loading="lazy">`;
    t.addEventListener('click', (e) => {
      if (e.metaKey || e.shiftKey) { t.classList.toggle('sel'); }
      else { document.querySelectorAll('.tile.sel').forEach(x=>x.classList.remove('sel')); t.classList.add('sel'); }
      selCount = document.querySelectorAll('.tile.sel').length;
      document.getElementById('count').textContent = '已选 ' + selCount + ' 张';
    });
    t.addEventListener('dblclick', () => { lbi.src = '../photos/' + src; lb.classList.add('open'); });
    row.appendChild(t); acc += ar;
  }
}
render();
document.getElementById('zr').addEventListener('input', e => { rowH = +e.target.value; render(); });
window.addEventListener('resize', render);
document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('open'); });
</script>
</body>
</html>
