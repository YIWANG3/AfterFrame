<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>概念 B · 工作台</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:linear-gradient(180deg,#101013,#080809 60%);
    color:#f0f0f0; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
    font-size:13px; -webkit-font-smoothing:antialiased;
  }
  .glass {
    background:rgba(18,18,22,.55);
    backdrop-filter:blur(28px) saturate(1.5);
    box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.09);
  }
  svg.ic { width:16px; height:16px; stroke:currentColor; stroke-width:1.7; fill:none;
    stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }

  #app {
    height:100%; display:grid; gap:10px; padding:10px;
    grid-template-columns:224px minmax(0,1fr) 0px;
    transition:grid-template-columns .32s cubic-bezier(.3,1,.35,1);
  }
  #app.sel { grid-template-columns:224px minmax(0,1fr) 292px; }

  /* ── 侧栏卡片 ── */
  #side { border-radius:18px; padding:16px 10px 12px; display:flex; flex-direction:column; overflow:hidden; }
  #side .head { padding:0 10px 16px; }
  #side .head b { font-size:13.5px; font-weight:650; }
  #side .head p { font-size:11px; color:rgba(240,240,240,.45); margin-top:3px; }
  .nav { flex:1; overflow-y:auto; scrollbar-width:none; }
  .nav::-webkit-scrollbar { display:none; }
  .nav h3 { font-size:10px; font-weight:600; letter-spacing:.9px; text-transform:uppercase;
    color:rgba(240,240,240,.35); padding:14px 10px 5px; }
  .nav .it {
    display:flex; align-items:center; gap:9px; padding:6px 10px; border-radius:10px;
    color:rgba(240,240,240,.72); cursor:pointer; transition:background .12s;
  }
  .nav .it:hover { background:rgba(255,255,255,.07); }
  .nav .it.on { background:rgba(210,160,90,.16); color:#d2a05a; font-weight:500; }
  .nav .it i { margin-left:auto; font-style:normal; font-size:11px; color:rgba(240,240,240,.35); }
  .nav .it.on i { color:#d2a05a; }
  #side .foot { padding:10px 10px 0; }

  /* ── 内容井 ── */
  #well { position:relative; border-radius:18px; overflow:hidden; background:rgba(12,12,14,.9);
    box-shadow:0 20px 50px rgba(0,0,0,.4); }

  /* 单条指挥台:一块玻璃里承载全部控件,只用间距分组,零内嵌线框 */
  #console {
    position:absolute; top:12px; left:12px; right:12px; z-index:30; height:44px;
    border-radius:16px; display:flex; align-items:center; gap:6px; padding:0 6px;
  }
  .cbtn {
    height:32px; min-width:32px; padding:0 10px; border:none; border-radius:10px;
    background:transparent; color:rgba(240,240,240,.78); font:inherit; font-size:12.5px;
    cursor:pointer; display:flex; align-items:center; gap:6px; transition:background .12s;
  }
  .cbtn:hover { background:rgba(255,255,255,.09); }
  .cbtn.accent { color:#d2a05a; font-weight:600; }
  .cseg { display:flex; padding:2px; border-radius:11px; background:rgba(255,255,255,.06); }
  .cseg button { border:none; background:transparent; color:rgba(240,240,240,.55); width:32px; height:28px;
    border-radius:9px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .cseg button.on { background:rgba(255,255,255,.14); color:#fff; }
  .csearch { flex:1; display:flex; align-items:center; gap:8px; height:32px; padding:0 12px;
    border-radius:10px; color:rgba(240,240,240,.4); min-width:120px; max-width:340px;
    background:rgba(255,255,255,.06); transition:background .15s; }
  .csearch:focus-within { background:rgba(255,255,255,.1); }
  .csearch input { flex:1; min-width:0; background:none; border:none; outline:none;
    color:#f0f0f0; font:inherit; font-size:12.5px; }
  .csearch input::placeholder { color:rgba(240,240,240,.32); }
  .spacer { flex:1; }

  /* 网格 */
  #grid { position:absolute; inset:0; overflow-y:auto; padding:70px 14px 16px;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:14px 12px;
    align-content:start;
    scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.18) transparent; }
  #grid::-webkit-scrollbar { width:8px; }
  #grid::-webkit-scrollbar-thumb { background:rgba(255,255,255,.15); border-radius:4px; }
  .card { cursor:pointer; }
  .card .ph { position:relative; aspect-ratio:4/3; border-radius:12px; overflow:hidden; }
  .card .ph img { width:100%; height:100%; object-fit:cover; display:block; transition:filter .13s, transform .18s; }
  .card:hover .ph img { filter:brightness(1.08); }
  .card.sel .ph::after { content:""; position:absolute; inset:0; border-radius:inherit;
    box-shadow:inset 0 0 0 2.5px #d2a05a; }
  .card .nm { margin-top:7px; font-size:11.5px; padding:0 2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .mt { margin-top:2px; font-size:10.5px; color:rgba(240,240,240,.4); padding:0 2px; }

  /* ── 检查器卡片:选中滑入 ── */
  #insp {
    border-radius:18px; overflow:hidden; display:flex; flex-direction:column; min-width:0;
    opacity:0; transform:translateX(26px);
    transition:opacity .22s, transform .3s cubic-bezier(.3,1,.35,1);
  }
  #app.sel #insp { opacity:1; transform:none; }
  #insp .hero { aspect-ratio:4/3; background:#000; flex-shrink:0; }
  #insp .hero img { width:100%; height:100%; object-fit:contain; display:block; }
  #insp .body { padding:16px 18px; overflow-y:auto; scrollbar-width:none; }
  #insp .body::-webkit-scrollbar { display:none; }
  #insp h2 { font-size:14px; font-weight:600; }
  #insp .stars { margin-top:6px; color:#d2a05a; font-size:13px; letter-spacing:2px; }
  #insp h4 { font-size:10px; font-weight:600; letter-spacing:.9px; text-transform:uppercase;
    color:rgba(240,240,240,.35); margin:18px 0 6px; }
  #insp .row { display:flex; justify-content:space-between; gap:12px; padding:3.5px 0; font-size:12px; }
  #insp .row b { font-weight:400; color:rgba(240,240,240,.45); }
  #insp .row span { text-align:right; }

  /* JobDock */
  #dock { position:fixed; right:22px; bottom:20px; z-index:50; width:264px; border-radius:15px; padding:12px 14px; }
  #dock .h { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:500; }
  #dock .h em { font-style:normal; margin-left:auto; font-size:10.5px; color:rgba(240,240,240,.4); }
  #dock .bar { height:3.5px; border-radius:2px; background:rgba(255,255,255,.1); margin-top:9px; overflow:hidden; }
  #dock .bar i { display:block; height:100%; width:62%; background:#d2a05a; border-radius:2px; }
  .spin { width:13px; height:13px; border-radius:50%; border:2px solid rgba(210,160,90,.25);
    border-top-color:#d2a05a; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="app">
  <aside id="side" class="glass">
    <div class="head"><b>main.afcatalog</b><p>1,247 个素材 · 更新于今天</p></div>
    <div class="nav">
      <div class="it on"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m5 19 5.5-5.5 3 3L17 13l4 4"/></svg>全部素材<i>1,247</i></div>
      <div class="it"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg>最近添加<i>36</i></div>
      <div class="it"><svg class="ic" viewBox="0 0 24 24"><path d="m12 3 2.7 5.7 6.3.8-4.6 4.3 1.2 6.2-5.6-3.1-5.6 3.1 1.2-6.2L3 9.5l6.3-.8Z"/></svg>已评分<i>89</i></div>
      <div class="it"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>人物<i>12</i></div>
      <div class="it"><svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>地图</div>
      <h3>文件夹</h3>
      <div class="it"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>大阪之夜<i>64</i></div>
      <div class="it"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>加州公路<i>38</i></div>
      <div class="it"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>夜市扫街<i>57</i></div>
    </div>
    <div class="foot">
      <div class="it"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.06-.4.1-.8.1-1.2Z"/></svg>设置</div>
    </div>
  </aside>

  <main id="well">
    <div id="console" class="glass">
      <button class="cbtn accent"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>导入</button>
      <div class="cseg">
        <button class="on" title="网格"><svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></button>
        <button title="两端对齐"><svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="14" width="8" height="6" rx="1.5"/><rect x="13" y="14" width="8" height="6" rx="1.5"/></svg></button>
        <button title="瀑布流"><svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><rect x="3" y="3" width="8" height="11" rx="1.5"/><rect x="13" y="3" width="8" height="7" rx="1.5"/><rect x="3" y="16" width="8" height="5" rx="1.5"/><rect x="13" y="12" width="8" height="9" rx="1.5"/></svg></button>
      </div>
      <div class="csearch">
        <svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input placeholder="搜索照片、相机、地点、文字">
      </div>
      <div class="spacer"></div>
      <button class="cbtn">导入时间 ↓</button>
      <button class="cbtn"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
      <button class="cbtn"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg></button>
    </div>
    <div id="grid"></div>
  </main>

  <aside id="insp" class="glass">
    <div class="hero"><img id="hero" src="" alt=""></div>
    <div class="body">
      <h2 id="iname">—</h2>
      <div class="stars">★★★★★</div>
      <h4>属性</h4>
      <div class="row"><b>尺寸</b><span id="idim">—</span></div>
      <div class="row"><b>大小</b><span id="isize">—</span></div>
      <div class="row"><b>类型</b><span>JPG</span></div>
      <h4>相机</h4>
      <div class="row"><b>机身</b><span id="icam">—</span></div>
      <div class="row"><b>镜头</b><span id="ilens">—</span></div>
      <h4>曝光</h4>
      <div class="row"><b>参数</b><span id="iexp">—</span></div>
      <h4>日期</h4>
      <div class="row"><b>拍摄时间</b><span id="idate">—</span></div>
    </div>
  </aside>
</div>

<div id="dock" class="glass">
  <div class="h"><div class="spin"></div>正在生成预览<em>778 / 1,247</em></div>
  <div class="bar"><i></i></div>
</div>

<script>
const P = [
  ['p01.jpg','4708 × 3128','8.6 MB','Canon EOS 6D','EF24-105mm f/4L','ISO 100 · f/8 · 55mm','2018-02-18'],
  ['p02.jpg','5203 × 4000','11.2 MB','Canon EOS R6m2','RF24-70mm F2.8 L','ISO 200 · f/2.8 · 24mm','2025-12-15'],
  ['p03.jpg','5911 × 3949','12.4 MB','Canon EOS R6m2','RF100-500mm L','ISO 100 · f/10 · 186mm','2025-12-16'],
  ['p04.jpg','5918 × 4000','9.8 MB','Canon EOS R6m2','RF24-70mm F2.8 L','ISO 100 · f/3.5 · 39mm','2026-05-23'],
  ['p05.jpg','5184 × 4000','10.5 MB','Canon EOS R6m2','RF24-70mm F2.8 L','ISO 125 · f/2.8 · 24mm','2025-07-26'],
  ['p06.jpg','5728 × 4000','11.8 MB','Canon EOS R6m2','RF24-70mm F2.8 L','ISO 640 · f/4 · 24mm','2025-12-17'],
  ['p07.jpg','5627 × 3687','10.1 MB','Canon EOS R6m2','RF24-70mm F2.8 L','ISO 640 · f/5.6 · 70mm','2025-12-17'],
  ['p08.jpg','5189 × 3815','9.4 MB','Canon EOS R6m2','RF24-70mm F2.8 L','ISO 640 · f/5 · 35mm','2025-12-17'],
  ['p09.jpg','5150 × 3954','9.9 MB','Canon EOS R6m2','RF24-70mm F2.8 L','ISO 640 · f/5 · 35mm','2025-12-17'],
  ['p10.jpg','6000 × 4000','13.0 MB','Canon EOS R6m2','RF24-70mm F2.8 L','ISO 1000 · f/10 · 24mm','2025-12-19'],
  ['p11.jpg','5394 × 4000','11.5 MB','Canon EOS R6m2','RF24-70mm F2.8 L','ISO 1000 · f/2.8 · 70mm','2025-12-19'],
  ['p12.jpg','4704 × 4000','10.8 MB','Canon EOS R6m2','RF24-70mm F2.8 L','ISO 1000 · f/2.8 · 28mm','2025-12-19'],
];
const grid = document.getElementById('grid');
const app = document.getElementById('app');
P.concat(P).forEach(([src,dim,size,cam,lens,exp,date], n) => {
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `<div class="ph"><img src="../photos/${src}" loading="lazy"></div>
    <div class="nm">${src}</div><div class="mt">${dim} · ${size}</div>`;
  c.addEventListener('click', () => {
    document.querySelectorAll('.card.sel').forEach(x=>x.classList.remove('sel'));
    c.classList.add('sel');
    app.classList.add('sel');
    document.getElementById('hero').src = '../photos/' + src;
    document.getElementById('iname').textContent = src;
    document.getElementById('idim').textContent = dim;
    document.getElementById('isize').textContent = size;
    document.getElementById('icam').textContent = cam;
    document.getElementById('ilens').textContent = lens;
    document.getElementById('iexp').textContent = exp;
    document.getElementById('idate').textContent = date;
  });
  grid.appendChild(c);
});
grid.addEventListener('click', (e) => {
  if (e.target === grid) {
    document.querySelectorAll('.card.sel').forEach(x=>x.classList.remove('sel'));
    app.classList.remove('sel');
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.card.sel').forEach(x=>x.classList.remove('sel'));
    app.classList.remove('sel');
  }
});
</script>
</body>
</html>
