<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>AfterFrame · 音乐 App 风格 demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }

  /* ── token:与 gallery demo 同一套(颜色 / 材质 / 圆角三层)── */
  :root { --g-blur:20px; --g-sat:1.4; --win-r:16px; --pane-inset:8px; --pane-r:calc(var(--win-r) - var(--pane-inset)); }
  :root[data-theme="dark"] {
    --stage-a:#101013; --stage-b:#08080a; --well-rgb:13 13 15;
    --glass-rgb:22 22 26; --g-alpha:.6; --g-alpha-pop:.72;
    --glass:rgb(var(--glass-rgb) / var(--g-alpha));
    --glass-edge:rgba(255,255,255,.07); --pop-shadow:0 8px 24px rgba(0,0,0,.35);
    --pane:rgba(255,255,255,.055); --modal-bg:#1a1a1e;
    --text:#f2f2f2; --muted:rgba(242,242,242,.62); --muted2:rgba(242,242,242,.46);
    --accent:#f5f5f5; --accent-ink:#141414; --chk-url:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2523141414%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M20%206%209%2017l-5-5%22/%3E%3C/svg%3E");
    --fill:rgba(255,255,255,.07); --fill-hover:rgba(255,255,255,.11);
    --seg-thumb:rgba(255,255,255,.14); --seg-thumb-ink:#fff;
    --scrim:linear-gradient(180deg, rgb(var(--well-rgb) / .55), rgb(var(--well-rgb) / 0) 75%);
    --scrimB:linear-gradient(0deg, rgb(var(--well-rgb) / .55), rgb(var(--well-rgb) / 0) 75%);
    --tshadow:0 1px 14px rgba(0,0,0,.6); --chip-solid:#232326; --pop-solid:#242428;
  }
  :root[data-theme="light"] {
    --stage-a:#f4f4f5; --stage-b:#e9e9eb; --well-rgb:246 246 247;
    --glass-rgb:253 253 254; --g-alpha:.66; --g-alpha-pop:.78;
    --glass:rgb(var(--glass-rgb) / var(--g-alpha));
    --glass-edge:rgba(0,0,0,.05); --pop-shadow:0 8px 24px rgba(0,0,0,.12);
    --pane:rgba(255,255,255,.62); --modal-bg:#fbfbfc;
    --text:#1d1d1f; --muted:rgba(29,29,31,.66); --muted2:rgba(29,29,31,.5);
    --accent:#1d1d1f; --accent-ink:#fff; --chk-url:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22white%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M20%206%209%2017l-5-5%22/%3E%3C/svg%3E");
    --fill:rgba(29,29,31,.06); --fill-hover:rgba(29,29,31,.1);
    --seg-thumb:rgba(255,255,255,.95); --seg-thumb-ink:#1d1d1f;
    --scrim:linear-gradient(180deg, rgb(var(--well-rgb) / .7), rgb(var(--well-rgb) / 0) 75%);
    --scrimB:linear-gradient(0deg, rgb(var(--well-rgb) / .7), rgb(var(--well-rgb) / 0) 75%);
    --tshadow:0 0 12px rgba(244,244,245,.9); --chip-solid:#fff; --pop-solid:#fff;
  }
  body {
    color:var(--text); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
    font-size:13px; -webkit-font-smoothing:antialiased;
    background:linear-gradient(180deg, var(--stage-a), var(--stage-b) 70%);
  }
  /* Electron 壳:底透明吃 vibrancy,整窗同一层半透材质 */
  body.electron { background:rgb(var(--well-rgb) / .8); }
  body.electron.solid { background:rgb(var(--well-rgb)); }
  body.solid .glass { background:var(--chip-solid) !important; backdrop-filter:none !important; }
  body.solid .pop { background:var(--pop-solid) !important; backdrop-filter:none !important; }

  svg.ic { width:16px; height:16px; stroke:currentColor; stroke-width:1.75; fill:none;
    stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
  .glass { background:var(--glass); backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat));
    box-shadow:inset 0 0 0 1px var(--glass-edge); }

  /* 纤细滚动条:hover 才显 */
  ::-webkit-scrollbar { width:7px; height:7px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background:transparent; }
  ::-webkit-scrollbar-thumb { background-color:transparent; border-radius:999px; border:2px solid transparent; background-clip:padding-box; }
  #view:hover::-webkit-scrollbar-thumb, #side nav:hover::-webkit-scrollbar-thumb { background-color:color-mix(in srgb, var(--text) 22%, transparent); }
  ::-webkit-scrollbar-thumb:hover { background-color:color-mix(in srgb, var(--text) 40%, transparent); }

  /* 拖拽区:只盖没有控件的地方 */
  #dragzone, #dragzone2 { display:none; -webkit-app-region:drag; position:fixed; z-index:15; }
  body.electron #dragzone { display:block; top:0; left:0; width:calc(228px + var(--pane-inset) * 2); height:44px; }
  body.electron #dragzone2 { display:block; top:0; left:calc(228px + var(--pane-inset) * 2); right:0; height:12px; }
  body.fs #dragzone, body.fs #dragzone2 { display:none; }

  /* ─────── 侧栏:内缩圆角面板,搜索在顶部(音乐 App 式)─────── */
  #side { position:fixed; inset:var(--pane-inset) auto var(--pane-inset) var(--pane-inset); width:228px; z-index:40;
    border-radius:var(--pane-r); background:var(--pane); padding:14px 10px 10px;
    display:flex; flex-direction:column; overflow:hidden; -webkit-app-region:no-drag; }
  body.electron #side { padding-top:44px; }
  body.electron.fs #side { padding-top:14px; }
  #side .search { display:flex; align-items:center; gap:8px; height:32px; border-radius:10px; padding:0 10px;
    background:var(--fill); color:var(--muted2); margin:0 2px 12px; }
  #side .search input { flex:1; min-width:0; background:none; border:none; outline:none; color:var(--text); font:inherit; font-size:12.5px; }
  #side .search input::placeholder { color:var(--muted2); }
  #side nav { flex:1; overflow-y:auto; }
  #side h3 { font-size:10px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--muted2); padding:18px 12px 8px; }
  .it { display:flex; align-items:center; gap:11px; padding:7.5px 12px; border-radius:10px; color:var(--muted); cursor:pointer;
    transition:background .12s, color .12s; font-size:13px; margin-bottom:1px; }
  .it:hover { background:var(--fill); color:var(--text); }
  .it.on { background:color-mix(in srgb, var(--accent) 15%, transparent); color:var(--accent); font-weight:550; }
  .it i { margin-left:auto; font-style:normal; font-size:11px; color:var(--muted2); font-variant-numeric:tabular-nums; }
  .it.on i { color:var(--accent); }
  .it .cv { width:26px; height:26px; border-radius:6px; object-fit:cover; flex-shrink:0; margin:-3px 0; }

  /* ─────── 内容区:整体滚动,顶带浮在上面 ─────── */
  #view { position:fixed; inset:0 0 0 calc(228px + var(--pane-inset) * 2); overflow-y:auto; overflow-x:hidden;
    padding:72px 24px 110px; container-type:inline-size; container-name:view; }
  #scrim { position:fixed; top:0; left:0; right:0; height:112px; z-index:20; pointer-events:none;
    backdrop-filter:blur(18px) saturate(1.15);
    -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 50%,transparent 100%); mask-image:linear-gradient(180deg,#000 0%,#000 50%,transparent 100%);
    background:var(--scrim); opacity:0; visibility:hidden; }
  body.solid #scrim { backdrop-filter:none; mask-image:none; -webkit-mask-image:none;
    background:linear-gradient(180deg, rgb(var(--well-rgb)) 35%, rgb(var(--well-rgb) / 0)); }
  #scrimB { position:fixed; bottom:0; left:calc(228px + var(--pane-inset) * 2); right:0; height:120px; z-index:20; pointer-events:none;
    backdrop-filter:blur(18px) saturate(1.15);
    -webkit-mask-image:linear-gradient(0deg,#000 0%,#000 30%,transparent 100%); mask-image:linear-gradient(0deg,#000 0%,#000 30%,transparent 100%);
    background:var(--scrimB); opacity:0; visibility:hidden; }
  #top { position:fixed; top:0; left:calc(228px + var(--pane-inset) * 2); right:0; height:64px; z-index:30;
    display:flex; align-items:center; gap:10px; padding:0 24px; pointer-events:none; }
  #top > * { pointer-events:auto; flex-shrink:0; }
  #top h1 { font-size:20px; font-weight:680; letter-spacing:-.2px; text-shadow:var(--tshadow); transition:opacity .15s; white-space:nowrap; }
  #top h1.dim { opacity:0; }
  #top .title p { font-size:11.5px; color:var(--muted); margin-top:1px; text-shadow:var(--tshadow); white-space:nowrap; }
  body.folder #top .title p { display:none; }
  body:not(.folder) #fhead, body:not(.folder) .fctl { display:none; }
  #filCnt { position:absolute; top:-2px; right:-2px; min-width:14px; height:14px; padding:0 3px; border-radius:7px; background:var(--accent); color:var(--accent-ink);
    font-size:9px; font-weight:600; font-style:normal; display:none; align-items:center; justify-content:center; pointer-events:none; }
  #filCnt.show { display:flex; }
  #filBtn.on { background:var(--seg-thumb); color:var(--seg-thumb-ink); }
  /* 筛选 chips 行:随筛选按钮展开;chips 区横向滚动 + 两端渐隐,「重置」固定行尾 */
  #filters { position:fixed; top:58px; left:calc(228px + var(--pane-inset) * 2 + 24px); right:24px; z-index:29; border-radius:999px; min-height:40px; padding:5px 8px;
    display:flex; align-items:center; gap:4px; overflow:hidden; opacity:0; transform:translateY(-8px); pointer-events:none;
    transition:opacity .18s, transform .2s cubic-bezier(.3,1,.35,1); -webkit-app-region:no-drag; }
  #filters .chips { flex:1; min-width:0; display:flex; align-items:center; gap:5px; overflow-x:auto; scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent); mask-image:linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent); }
  #filters .chips::-webkit-scrollbar { display:none; }
  body.fil #filters { opacity:1; transform:none; pointer-events:auto; }
  body.fil #view { padding-top:116px; }
  body.fil #scrim { height:156px; }
  .chip { height:28px; border:none; border-radius:999px; padding:0 12px; flex-shrink:0; background:transparent; color:var(--muted); font:inherit; font-size:12px; cursor:pointer;
    display:flex; align-items:center; gap:5px; transition:background .12s, color .12s; white-space:nowrap; }
  .chip .ic { width:12px; height:12px; color:var(--muted2); margin-right:-3px; }
  .chip:hover { background:var(--fill); color:var(--text); }
  .chip.on { background:var(--seg-thumb); color:var(--seg-thumb-ink); font-weight:550; }
  .chip.reset { color:var(--muted2); }
  .starrow { display:flex; gap:2px; padding:0 8px; flex-shrink:0; cursor:pointer; }
  .starrow b { display:flex; color:var(--muted2); transition:color .1s; }
  .starrow b.on { color:var(--text); } .starrow b.on svg { fill:currentColor; }
  .chipPop { position:fixed; }
  #top .sp { flex:1; pointer-events:none; }
  .seg { display:flex; padding:3px; border-radius:999px; height:34px; }
  .seg button { border:none; background:transparent; color:var(--muted); font:inherit; padding:0 12px; border-radius:999px; cursor:pointer;
    display:flex; align-items:center; gap:6px; font-size:12.5px; transition:background .15s, color .15s; }
  .seg button.on { background:var(--seg-thumb); color:var(--seg-thumb-ink); font-weight:550; }
  .isl { height:34px; border-radius:999px; display:flex; align-items:center; padding:0 4px; }
  .ib { width:28px; height:28px; border:none; border-radius:999px; background:transparent; color:var(--muted); cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:background .12s, color .12s; position:relative; }
  .ib:hover { background:var(--fill); color:var(--text); }
  .rel { position:relative; display:flex; }
  .btn-imp { height:34px; border:none; border-radius:999px; padding:0 14px; cursor:pointer; background:var(--accent); color:var(--accent-ink);
    font:inherit; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .btn-imp:active { transform:scale(.96); }
  .pop { position:absolute; top:40px; right:0; min-width:170px; z-index:80; border-radius:14px; padding:6px;
    background:rgb(var(--glass-rgb) / var(--g-alpha-pop)); backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat));
    box-shadow:var(--pop-shadow), inset 0 0 0 1px var(--glass-edge);
    opacity:0; transform:translateY(-4px); pointer-events:none; transition:opacity .14s, transform .18s cubic-bezier(.3,1,.35,1); }
  .pop.open { opacity:1; transform:none; pointer-events:auto; }
  .pop h5 { font-size:10px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--muted2); padding:8px 10px 4px; }
  .pop .opt { display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:9px; font-size:12.5px; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .pop .opt:hover { background:var(--fill); color:var(--text); }
  .pop .opt.on { color:var(--text); font-weight:550; }
  .pop .opt.on::after { content:""; width:12px; height:12px; margin-left:auto; background:currentColor;
    -webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M20%206%209%2017l-5-5%22/%3E%3C/svg%3E") center/contain no-repeat; mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M20%206%209%2017l-5-5%22/%3E%3C/svg%3E") center/contain no-repeat; }
  .pop .opt em { font-style:normal; margin-left:auto; padding-left:14px; font-size:11px; color:var(--muted2); }

  /* ─────── 首页:hero + 货架 ─────── */
  .page { display:none; } .page.on { display:block; }
  .hero { position:relative; height:320px; border-radius:18px; overflow:hidden; cursor:pointer; }
  .hero img { width:100%; height:100%; object-fit:cover; display:block; }
  .hero .ov { position:absolute; inset:0; background:linear-gradient(180deg, transparent 35%, rgba(0,0,0,.72)); }
  .hero .tx { position:absolute; left:28px; right:28px; bottom:26px; color:#fff; }
  .hero .eyebrow { font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; opacity:.8; }
  .hero h2 { font-size:34px; font-weight:700; letter-spacing:-.4px; margin:6px 0 4px; }
  .hero p { font-size:13px; opacity:.85; }
  .hero .go { position:absolute; right:24px; bottom:24px; height:36px; border:none; border-radius:999px; padding:0 16px;
    background:rgba(255,255,255,.18); backdrop-filter:blur(12px); color:#fff; font:inherit; font-size:12.5px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:6px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.18); }
  .shelf { margin-top:30px; }
  .shelf h2 { font-size:17px; font-weight:650; display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
  .shelf h2 a { font-size:12px; color:var(--muted2); font-weight:500; cursor:pointer; display:flex; align-items:center; gap:2px; }
  .shelf h2 a:hover { color:var(--text); }
  .row { display:flex; gap:14px; overflow-x:auto; scrollbar-width:none; padding:2px 24px 6px; margin:0 -24px;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 40px), transparent);
    mask-image:linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 40px), transparent); }
  .row::-webkit-scrollbar { display:none; }
  .card { flex-shrink:0; cursor:pointer; }
  .card .im { border-radius:12px; overflow:hidden; background:var(--fill); position:relative; }
  .card img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .22s cubic-bezier(.3,.8,.4,1); }
  .card:hover img { transform:scale(1.03); }
  .card .t { margin-top:8px; font-size:12.5px; font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .m { font-size:11px; color:var(--muted2); margin-top:2px; }
  .card.l { width:232px; } .card.l .im { height:154px; }
  .card.s { width:160px; } .card.s .im { height:160px; }
  .card.w { width:260px; } .card.w .im { height:150px; }
  .card.m { width:200px; } .card.m .im { height:260px; }
  .card .lab { position:absolute; left:12px; bottom:10px; color:#fff; font-weight:650; font-size:15px; text-shadow:0 1px 10px rgba(0,0,0,.6); }
  .card .lab small { display:block; font-size:11px; font-weight:500; opacity:.85; margin-top:1px; }
  .card .im::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 55%, rgba(0,0,0,.5)); opacity:0; }
  .card.w .im::after, .card.m .im::after { opacity:1; }
  .card.sel .im { box-shadow:inset 0 0 0 2.5px var(--accent); }
  .card.sel .im::before { content:""; position:absolute; top:8px; left:8px; z-index:2; width:20px; height:20px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 0 1px rgba(0,0,0,.2); background-image:var(--chk-url); background-size:12px 12px; background-position:center; background-repeat:no-repeat; }
  .person { flex-shrink:0; width:96px; text-align:center; cursor:pointer; }
  .person img { width:88px; height:88px; border-radius:50%; object-fit:cover; display:block; margin:0 auto; }
  .person .t { margin-top:8px; font-size:12.5px; font-weight:550; } .person .m { font-size:11px; color:var(--muted2); margin-top:1px; }

  /* ─────── 文件夹页 = 专辑页 ─────── */
  .fhead { position:relative; display:flex; gap:26px; align-items:flex-end; padding:8px 0 22px; }
  .fhead .amb { position:absolute; inset:-80px -24px 0; z-index:-1; overflow:hidden; opacity:0; transition:opacity .3s; pointer-events:none;
    -webkit-mask-image:linear-gradient(180deg,#000 40%,transparent); mask-image:linear-gradient(180deg,#000 40%,transparent); }
  .fhead .amb img { width:100%; height:100%; object-fit:cover; filter:blur(70px) saturate(1.2); transform:scale(1.3); opacity:.45; }
  body.amb .fhead .amb { opacity:1; }
  .fhead .cover { width:216px; height:216px; border-radius:14px; object-fit:cover; flex-shrink:0; box-shadow:0 0 0 1px var(--glass-edge); }
  .fhead .eyebrow { font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--muted2); }
  .fhead h1 { font-size:36px; font-weight:720; letter-spacing:-.5px; margin:4px 0 6px; }
  .fhead .meta { font-size:13px; color:var(--muted); }
  .fhead .desc { font-size:12.5px; color:var(--muted2); margin-top:8px; max-width:560px; line-height:1.5; }
  .fhead .acts { display:flex; gap:8px; margin-top:16px; }
  .btn-p { height:36px; border:none; border-radius:999px; padding:0 18px; background:var(--accent); color:var(--accent-ink); font:inherit; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:7px; }
  .btn-p svg { fill:currentColor; stroke:none; width:14px; height:14px; }
  .btn-s { height:36px; border:none; border-radius:999px; padding:0 16px; background:var(--fill); color:var(--text); font:inherit; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:7px; }
  .btn-s:hover { background:var(--fill-hover); }
  .btn-s.i { width:36px; padding:0; justify-content:center; }
  .fctl { display:flex; align-items:center; gap:10px; padding:4px 0 14px; }
  .fctl .cnt { font-size:12px; color:var(--muted2); margin-left:auto; font-variant-numeric:tabular-nums; }

  /* 网格(两端对齐)*/
  #grid .r { display:flex; gap:8px; margin-bottom:8px; }
  .tile { position:relative; overflow:hidden; border-radius:10px; cursor:pointer; flex-grow:1; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .22s cubic-bezier(.3,.8,.4,1); }
  .tile:hover img { transform:scale(1.018); }
  .tile.sel::after { content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 2.5px var(--accent); }
  .tile.sel::before { content:""; position:absolute; top:8px; left:8px; z-index:2; width:20px; height:20px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 0 1px rgba(0,0,0,.2); background-image:var(--chk-url); background-size:12px 12px; background-position:center; background-repeat:no-repeat; }

  /* 列表 = 曲目表 */
  #list { display:none; }
  #list .hd, #list .tr { display:grid; grid-template-columns:36px minmax(0,1fr) 150px 170px 130px 96px 76px; align-items:center; gap:12px; padding:0 12px; }
  #list .hd { height:32px; font-size:10.5px; font-weight:600; letter-spacing:.8px; text-transform:uppercase; color:var(--muted2); }
  #list .tr { height:54px; border-radius:10px; cursor:pointer; font-size:12.5px; color:var(--muted); transition:background .1s; }
  #list .tr:hover { background:var(--fill); color:var(--text); }
  #list .tr.sel { background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--text); }
  #list .tr .n { color:var(--muted2); font-variant-numeric:tabular-nums; font-size:11.5px; }
  #list .tr .nm { display:flex; align-items:center; gap:12px; min-width:0; color:var(--text); }
  #list .tr .nm img { width:40px; height:40px; border-radius:6px; object-fit:cover; flex-shrink:0; }
  #list .tr .nm div { min-width:0; }
  #list .tr .nm b { display:block; font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #list .tr .nm small { display:block; font-size:11px; color:var(--muted2); margin-top:1px; }
  #list .tr .r { text-align:right; font-variant-numeric:tabular-nums; }
  .stars { display:flex; gap:1px; color:var(--muted2); } .stars svg { width:12px; height:12px; } .stars svg.on { fill:currentColor; color:var(--text); }
  #list .tr.sel .stars svg.on, #list .tr:hover .stars svg.on { color:var(--text); }
  body.list #grid { display:none; } body.list #list { display:block; }

  /* ─────── 底部「当前选中」条 = 播放条 ─────── */
  #player { position:fixed; left:calc(228px + var(--pane-inset) * 2 + 24px); right:24px; bottom:16px; z-index:50; max-width:840px; margin:0 auto;
    height:64px; border-radius:18px; display:flex; align-items:center; gap:14px; padding:0 14px 0 10px;
    transform:translateY(96px); opacity:0; transition:transform .24s cubic-bezier(.3,1,.35,1), opacity .18s; -webkit-app-region:no-drag; }
  body.sel #player { transform:none; opacity:1; }
  #player .th { width:44px; height:44px; border-radius:9px; object-fit:cover; flex-shrink:0; }
  #player .tx { min-width:0; width:200px; }
  #player .tx b { display:block; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #player .tx small { display:block; font-size:11px; color:var(--muted2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #player .stars { margin-left:auto; cursor:pointer; } #player .stars svg { width:14px; height:14px; }
  #player .pOpen { height:32px; border:none; border-radius:999px; padding:0 14px; background:var(--accent); color:var(--accent-ink); font:inherit; font-size:12.5px; font-weight:600;
    display:flex; align-items:center; gap:6px; cursor:pointer; margin-left:8px; }
  #player .pOpen em { font-style:normal; font-size:10px; opacity:.6; margin-left:2px; }
  #player .acts { display:flex; align-items:center; gap:2px; margin-left:4px; }
  #player .x { margin-left:2px; }

  /* ─────── 幻灯片(影院)─────── */
  #lb { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.94); display:none; align-items:center; justify-content:center; }
  #lb.open { display:flex; }
  #lb img { max-width:calc(100% - 96px); max-height:calc(100% - 120px); object-fit:contain; border-radius:6px; }
  #lb .bar { position:absolute; bottom:22px; left:50%; transform:translateX(-50%); height:48px; border-radius:999px; padding:0 8px;
    display:flex; align-items:center; gap:4px; background:rgba(255,255,255,.12); backdrop-filter:blur(12px); box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); }
  #lb .bar .ib { width:36px; height:36px; color:#fff; } #lb .bar .ib:hover { background:rgba(255,255,255,.14); }
  #lb .bar .ib svg { fill:currentColor; stroke:none; width:16px; height:16px; }
  #lb .bar .ib.x svg { fill:none; stroke:currentColor; }
  #lb .cap { position:absolute; top:22px; left:0; right:0; text-align:center; color:rgba(255,255,255,.8); font-size:12.5px; }

  @container view (max-width: 900px) { #top h1 { font-size:18px; } .seg button span { display:none; } }
</style>

  document.documentElement.dataset.theme = eff;
  document.querySelectorAll('[data-theme]').forEach(o => o.classList.toggle('on', o.dataset.theme === themePref));
  document.querySelectorAll('.glass, .pop, #scrim, #scrimB').forEach(el => { el.style.backdropFilter = 'none'; });
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.glass, .pop, #scrim, #scrimB').forEach(el => { el.style.backdropFilter = ''; })));
}
sysMql.addEventListener('change', () => { if (themePref === 'system') applyTheme(); });
document.querySelectorAll('#morePop [data-theme]').forEach(o => o.addEventListener('click', () => { themePref = o.dataset.theme; if (window.lg) window.lg.setTheme(themePref); applyTheme(); }));
document.querySelectorAll('#morePop [data-mat]').forEach(o => o.addEventListener('click', () => { document.querySelectorAll('[data-mat]').forEach(x => x.classList.toggle('on', x === o)); document.body.classList.toggle('solid', o.dataset.mat === 'solid'); }));
document.querySelectorAll('#morePop [data-amb]').forEach(o => o.addEventListener('click', () => { document.querySelectorAll('[data-amb]').forEach(x => x.classList.toggle('on', x === o)); document.body.classList.toggle('amb', o.dataset.amb === '1'); }));

/* ── Electron 壳 ── */
if (window.lg) { document.body.classList.add('electron'); window.lg.setTheme(themePref); window.lg.onFullscreen(fs => document.body.classList.toggle('fs', fs)); }
showAll();
</script>
</body>
</html>
