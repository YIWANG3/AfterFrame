<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Liquid Glass 概念实验室</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:linear-gradient(180deg,#101013,#070708 70%); color:#f0f0f0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px;
    -webkit-font-smoothing:antialiased;
  }
  h1 { font-size:22px; font-weight:650; }
  h1 + p { color:rgba(240,240,240,.5); font-size:13px; margin-top:-26px; }
  .cards { display:flex; gap:18px; padding:0 24px; flex-wrap:wrap; justify-content:center; }
  a.card {
    position:relative; width:300px; height:200px; border-radius:20px; overflow:hidden;
    text-decoration:none; color:#fff; display:block;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
    transition:transform .16s;
  }
  a.card:hover { transform:translateY(-4px) scale(1.015); }
  a.card img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(.75); }
  a.card .cap {
    position:absolute; left:10px; right:10px; bottom:10px; border-radius:14px; padding:12px 16px;
    background:rgba(16,16,20,.55); backdrop-filter:blur(20px) saturate(1.5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
  }
  a.card .cap b { font-size:14px; font-weight:600; display:block; }
  a.card .cap span { font-size:11.5px; color:rgba(240,240,240,.65); display:block; margin-top:3px; }
</style>
</head>
<body>
  <h1>Liquid Glass 概念实验室</h1>
  <p>三个自由方向 · 全部使用你的真实照片 · 点击进入可交互原型</p>
  <div class="cards">
    <a class="card" href="canvas.html">
      <img src="../photos/p02.jpg">
      <div class="cap"><b>A · 全景画布</b><span>照片铺满,极简图标轨 + 裸标题 + 胶囊岛</span></div>
    </a>
    <a class="card" href="studio.html">
      <img src="../photos/p05.jpg">
      <div class="cap"><b>B · 工作台</b><span>舞台悬浮卡片 + 单条指挥台 + 滑入检查器</span></div>
    </a>
    <a class="card" href="cinema.html">
      <img src="../photos/p12.jpg">
      <div class="cap"><b>C · 影院模式</b><span>大图沉浸 + 玻璃胶片带 + 光晕来自当前照片</span></div>
    </a>
  </div>
</body>
</html>
