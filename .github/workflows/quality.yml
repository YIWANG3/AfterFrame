name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/sidecar/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Python sidecar
        run: python -m pip install -e "services/sidecar[dev]"
      # Photo metadata is read with ExifTool (scripts/fetch-exiftool.mjs).
      - name: Cache ExifTool
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/native/.cache/Image-ExifTool-13.59.tar.gz
            apps/desktop/native/.cache/exiftool-13.59_64.zip
          key: exiftool-13.59-${{ runner.os }}
      - name: Fetch ExifTool
        run: node apps/desktop/scripts/fetch-exiftool.mjs
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Run repository checks
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --prefix apps/desktop

  electron-e2e:
    # macOS 15+: the Swift helpers use current AVFoundation APIs and carry no
    # old-SDK compatibility branches. The Windows build has its own job below.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/sidecar/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Python sidecar
        run: python -m pip install -e "services/sidecar[dev]"
      # Photo metadata is read with ExifTool (scripts/fetch-exiftool.mjs).
      - name: Cache ExifTool
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/native/.cache/Image-ExifTool-13.59.tar.gz
            apps/desktop/native/.cache/exiftool-13.59_64.zip
          key: exiftool-13.59-${{ runner.os }}
      - name: Fetch ExifTool
        run: node apps/desktop/scripts/fetch-exiftool.mjs
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Build native tools
        run: npm run build:native --prefix apps/desktop
      - name: Build renderer
        run: npm run build --prefix apps/desktop
      # The whole suite, e2e/*.spec.js: a new spec is in CI the moment it is
      # added. A spec that cannot run on the GitHub macOS VM skips itself with
      # test.skip(process.env.CI, reason) and runs locally only — today
      # 17-watched-dirs and the watched-folder describe of 60-file-lifecycle
      # (fs-watch delivery is too slow and uneven to assert on), 23-map and
      # 60-map-cluster-covers (no GPU/WebGL: MapLibre never renders, #163).
      # 62-people-real-model needs the face model only the nightly fetches,
      # 70-native-video a local ProRes clip, and the opt-in suites skip
      # without their flag (27-agent-mcp: AGENT_E2E=1, demo: DEMO=1).
      # Until 2026-10-14 this step carried a hand-written list of 71 paths,
      # edited 35 times: 66–69 were missed when they were added, and 68 then
      # failed every nightly for days (CI's 1024-px display) without a PR
      # ever running it. The nightly (e2e-nightly.yml) runs the same suite
      # with coverage and the people model.
      - name: Run Electron E2E
        run: npm run e2e:only --prefix apps/desktop
      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-failure
          path: apps/desktop/e2e/.artifacts/
          include-hidden-files: true
          retention-days: 7

  windows:
    # The unit suites, lint and the build on Windows (docs/windows-support-plan.md).
    # Informational for now: it reports and doesn't gate merges. Each check
    # runs even when one before it failed, so one red suite doesn't hide the
    # others. No Electron E2E here yet: the specs run on Windows since #208
    # (`npm run e2e` on a Windows checkout), a Windows runner round for them
    # is a decision still to take, not a capability gap.
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      # The runner converts checkouts to CRLF; keep the repository's LF
      # endings, as scripts/windows/setup-dev.ps1 does on a dev machine.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/sidecar/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Python sidecar
        run: python -m pip install -e "services/sidecar[dev]"
      # Photo metadata is read with ExifTool (scripts/fetch-exiftool.mjs).
      - name: Cache ExifTool
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/native/.cache/Image-ExifTool-13.59.tar.gz
            apps/desktop/native/.cache/exiftool-13.59_64.zip
          key: exiftool-13.59-${{ runner.os }}
      - name: Fetch ExifTool
        run: node apps/desktop/scripts/fetch-exiftool.mjs
      # Video on Windows goes through the bundled FFmpeg (scripts/fetch-ffmpeg.mjs).
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: apps/desktop/native/.cache/ffmpeg-n9.0.2-17-g2a571b6068-win64-lgpl-shared-9.0.zip
          key: ffmpeg-n9.0.2-17-g2a571b6068-${{ runner.os }}
      - name: Fetch FFmpeg
        run: node apps/desktop/scripts/fetch-ffmpeg.mjs
      # The unit suites run on Node and jsdom, not Electron.
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # The root package.json scripts are POSIX shell (VAR=… python3 …), so
      # the steps below call each suite directly.
      - name: Lint desktop
        if: ${{ !cancelled() }}
        run: npm run lint --prefix apps/desktop
      - name: Lint sidecar
        if: ${{ !cancelled() }}
        working-directory: services/sidecar
        run: |
          python -m ruff check . ../../tests
          python -m mypy --config-file pyproject.toml
      - name: Build renderer
        if: ${{ !cancelled() }}
        run: npm run build --prefix apps/desktop
      - name: Renderer tests
        if: ${{ !cancelled() }}
        run: npm run test:renderer --prefix apps/desktop
      - name: Electron main tests
        if: ${{ !cancelled() }}
        run: npm run test:electron --prefix apps/desktop
      - name: Repository Python tests
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: services/sidecar/src
          FFMPEG_PATH: ${{ github.workspace }}\apps\desktop\native\ffmpeg
        run: python -m unittest discover -s tests
