name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/sidecar/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Python sidecar
        run: python -m pip install -e "services/sidecar[dev]"
      # Photo metadata is read with ExifTool (scripts/fetch-exiftool.mjs).
      - name: Cache ExifTool
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/native/.cache/Image-ExifTool-13.59.tar.gz
            apps/desktop/native/.cache/exiftool-13.59_64.zip
          key: exiftool-13.59-${{ runner.os }}
      - name: Fetch ExifTool
        run: node apps/desktop/scripts/fetch-exiftool.mjs
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Run repository checks
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --prefix apps/desktop

  electron-e2e:
    # macOS 15+: the Swift helpers use current AVFoundation APIs (the product
    # is macOS-only and does not carry old-SDK compatibility branches).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/sidecar/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Python sidecar
        run: python -m pip install -e "services/sidecar[dev]"
      # Photo metadata is read with ExifTool (scripts/fetch-exiftool.mjs).
      - name: Cache ExifTool
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/native/.cache/Image-ExifTool-13.59.tar.gz
            apps/desktop/native/.cache/exiftool-13.59_64.zip
          key: exiftool-13.59-${{ runner.os }}
      - name: Fetch ExifTool
        run: node apps/desktop/scripts/fetch-exiftool.mjs
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Build native tools
        run: npm run build:native --prefix apps/desktop
      - name: Build renderer
        run: npm run build --prefix apps/desktop
      # CI subset. Everything else runs nightly (e2e-nightly.yml). Left out
      # and why (2026-09-17, #58):
      #   22-lightbox-zoom, 23-map   no GPU/WebGL on the macOS VM
      #   14-video                   no reliable AVFoundation playback
      #   17-watched-dirs            fs-watch timing
      # 23 and 17 also skip themselves under CI (test.skip(process.env.CI)),
      # so the nightly's own result stays meaningful: a red nightly is
      # something new, not those two again.
      # The save / people suites were once excluded as "slow I/O"; the real
      # cause was the seeded catalog's absolute paths (fixed in #57), so they
      # are back. 02-navigation was excluded for the "Rated" race; the cause
      # was refreshAll browsing the scope it was called with after six status
      # IPC awaits, so an older click (or a job-finished refresh) could land
      # last and win (#68, with 44's identical failure), so it is back too.
      # 05-catalog was excluded for its thumbnail-regeneration test; the cause
      # was a real repair bug (one budget shared by the two repair triggers),
      # so it is back as well. 12-missing-original's UNIQUE(asset_files.path)
      # was the startup metadata repair landing after the test's relink on the
      # slow VM and registering the original path anew (relink now reports
      # path_in_use; the spec waits for the repair); 25-collage-batch assumed
      # three page cards per row (#80). Both are back. Opt-in suites
      # (27-agent, demo) skip themselves.
      - name: Run Electron E2E (CI subset)
        run: >
          npm run e2e:only --prefix apps/desktop --
          e2e/01-launch.spec.js
          e2e/02-navigation.spec.js
          e2e/03-editor.spec.js
          e2e/04-sticker.spec.js
          e2e/05-catalog.spec.js
          e2e/06-save.spec.js
          e2e/07-depth.spec.js
          e2e/08-mcp-http.spec.js
          e2e/09-agent-bridge.spec.js
          e2e/10-settings.spec.js
          e2e/11-jobs-toasts.spec.js
          e2e/12-missing-original.spec.js
          e2e/12-people-view.spec.js
          e2e/13-i18n.spec.js
          e2e/15-welcome.spec.js
          e2e/16-open-with.spec.js
          e2e/18-editor-transform.spec.js
          e2e/18-people-flows.spec.js
          e2e/19-editor-layers.spec.js
          e2e/20-frame.spec.js
          e2e/21-canvas-pad.spec.js
          e2e/24-handwriting.spec.js
          e2e/25-collage-batch.spec.js
          e2e/26-mcp-parity.spec.js
          e2e/28-mcp-render.spec.js
          e2e/29-folder-order.spec.js
          e2e/29-tahoe-shell.spec.js
          e2e/30-sidebar-scroll.spec.js
          e2e/31-ui-regressions.spec.js
          e2e/31-version-navigation.spec.js
          e2e/32-gps-location-menu.spec.js
          e2e/33-split.spec.js
          e2e/34-settings-transfer.spec.js
          e2e/35-raw-import.spec.js
          e2e/36-mcp-jobs-tools.spec.js
          e2e/37-heic-import.spec.js
          e2e/38-legacy-catalog.spec.js
          e2e/39-context-menu-selection.spec.js
          e2e/40-crop-mouse.spec.js
          e2e/41-text-layer-panel.spec.js
          e2e/42-drop-and-menu.spec.js
          e2e/43-sticker-library.spec.js
          e2e/44-discover.spec.js
          e2e/45-collage-single.spec.js
          e2e/46-smart-collections.spec.js
          e2e/47-folder-filters.spec.js
          e2e/48-filter-multiselect.spec.js
          e2e/49-location-and-text-filters.spec.js
          e2e/50-country-city-filters.spec.js
          e2e/51-custom-filter-bar.spec.js
          e2e/52-color-filter.spec.js
          e2e/53-smart-collections-v2.spec.js
          e2e/54-frame-user-templates.spec.js
          e2e/55-personal-logos.spec.js
          e2e/56-brand-logos.spec.js
          e2e/60-file-lifecycle.spec.js
          e2e/61-dates-and-places.spec.js
      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-failure
          path: apps/desktop/e2e/.artifacts/
          include-hidden-files: true
          retention-days: 7

  windows:
    # The unit suites, lint and the build on Windows (docs/windows-support-plan.md).
    # Informational for now: it reports and doesn't gate merges. Each check
    # runs even when one before it failed, so one red suite doesn't hide the
    # others. No Electron E2E here: it needs Windows engines for the
    # macOS-only helpers first.
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      # The runner converts checkouts to CRLF; keep the repository's LF
      # endings, as scripts/windows/setup-dev.ps1 does on a dev machine.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/sidecar/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Python sidecar
        run: python -m pip install -e "services/sidecar[dev]"
      # Photo metadata is read with ExifTool (scripts/fetch-exiftool.mjs).
      - name: Cache ExifTool
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/native/.cache/Image-ExifTool-13.59.tar.gz
            apps/desktop/native/.cache/exiftool-13.59_64.zip
          key: exiftool-13.59-${{ runner.os }}
      - name: Fetch ExifTool
        run: node apps/desktop/scripts/fetch-exiftool.mjs
      # The unit suites run on Node and jsdom, not Electron.
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # The root package.json scripts are POSIX shell (VAR=… python3 …), so
      # the steps below call each suite directly.
      - name: Lint desktop
        if: ${{ !cancelled() }}
        run: npm run lint --prefix apps/desktop
      - name: Lint sidecar
        if: ${{ !cancelled() }}
        working-directory: services/sidecar
        run: |
          python -m ruff check . ../../tests
          python -m mypy --config-file pyproject.toml
      - name: Build renderer
        if: ${{ !cancelled() }}
        run: npm run build --prefix apps/desktop
      - name: Renderer tests
        if: ${{ !cancelled() }}
        run: npm run test:renderer --prefix apps/desktop
      - name: Electron main tests
        if: ${{ !cancelled() }}
        run: npm run test:electron --prefix apps/desktop
      - name: Sidecar tests
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: services/sidecar/src
        run: python -m unittest discover -s services/sidecar/tests
      - name: Repository Python tests
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: services/sidecar/src
        run: python -m unittest discover -s tests
