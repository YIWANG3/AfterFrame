name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/sidecar/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Python sidecar
        run: python -m pip install -e services/sidecar
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Run repository checks
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --prefix apps/desktop

  electron-e2e:
    # macOS 15+: the Swift helpers use current AVFoundation APIs (the product
    # is macOS-only and does not carry old-SDK compatibility branches).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/sidecar/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Python sidecar
        run: python -m pip install -e services/sidecar
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Build native tools
        run: npm run build:native --prefix apps/desktop
      - name: Build renderer
        run: npm run build --prefix apps/desktop
      # CI-stable subset: GitHub macOS VMs have no GPU/WebGL (23-map,
      # 22-lightbox-zoom), no reliable AVFoundation playback (14-video),
      # flaky fs-watch timing (17-watched-dirs, parts of 02/05), and slow
      # I/O that cascades editor/save timeouts (06, 12, 18-people-flows).
      # Those suites remain part of the local pre-release run
      # (npm run e2e:only). Promote a suite back here once it proves stable.
      - name: Run Electron E2E (CI-stable subset)
        run: >
          npm run e2e:only --prefix apps/desktop --
          e2e/01-launch.spec.js
          e2e/03-editor.spec.js
          e2e/04-sticker.spec.js
          e2e/07-depth.spec.js
          e2e/08-mcp-http.spec.js
          e2e/09-agent-bridge.spec.js
          e2e/10-settings.spec.js
          e2e/11-jobs-toasts.spec.js
          e2e/13-i18n.spec.js
          e2e/15-welcome.spec.js
          e2e/16-open-with.spec.js
          e2e/18-editor-transform.spec.js
          e2e/19-editor-layers.spec.js
          e2e/20-frame.spec.js
          e2e/21-canvas-pad.spec.js
