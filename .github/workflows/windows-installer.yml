name: Windows installer

# The unsigned NSIS installer for Windows, built as on the Windows dev box:
# sidecar (PyInstaller) → ExifTool → FFmpeg → renderer → electron-builder,
# then checked for what a broken build lacked before (sharp, the place index,
# a sidecar and ExifTool that run, an app that starts) and that the sidecar
# reads a video with the bundled FFmpeg.
#
# Run it by hand (Actions ▸ Windows installer ▸ Run workflow) to get the
# installer as a build artifact for 14 days. A pull request that changes this
# file builds and checks it without keeping it.
#
# Run on a release tag (Use workflow from ▸ Tags ▸ v0.5.10, or
# `gh workflow run windows-installer.yml --ref v0.5.10`), it also adds the
# installer to that tag's GitHub Release. The Mac's release.sh creates the
# release, with the notes and the DMG, and refuses one that already exists, so
# this waits for it instead of making it.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-installer.yml

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      # The runner converts checkouts to CRLF; keep the repository's LF endings.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Check the tag is the app's version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but the app says $version" }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/sidecar/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install the sidecar and PyInstaller
        run: python -m pip install -e "services/sidecar[jimeng]" "pyinstaller>=6,<7"
      - name: Cache ExifTool
        uses: actions/cache@v4
        with:
          path: apps/desktop/native/.cache/exiftool-13.59_64.zip
          key: exiftool-13.59-${{ runner.os }}
      - name: Fetch ExifTool
        run: node apps/desktop/scripts/fetch-exiftool.mjs
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: apps/desktop/native/.cache/ffmpeg-n9.0.2-17-g2a571b6068-win64-lgpl-shared-9.0.zip
          key: ffmpeg-n9.0.2-17-g2a571b6068-${{ runner.os }}
      - name: Fetch FFmpeg
        run: node apps/desktop/scripts/fetch-ffmpeg.mjs
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Build the sidecar
        working-directory: services/sidecar
        run: pyinstaller media-workspace.spec --distpath dist --noconfirm
      - name: Build the renderer
        run: npm run build --prefix apps/desktop
      - name: Build the installer
        working-directory: apps/desktop
        run: npx electron-builder --win --publish never
      - name: Check what the installer carries
        shell: pwsh
        working-directory: apps/desktop/release
        run: |
          $ErrorActionPreference = "Stop"
          $resources = "win-unpacked/resources"
          # electron-builder only warns when it can't collect a dependency,
          # and main.js requires sharp first thing: without it the app sits
          # at launch with no window.
          if (-not (Test-Path "$resources/app.asar.unpacked/node_modules/sharp/package.json")) { throw "sharp is missing from the app" }
          $data = "$resources/sidecar/media-workspace/_internal/media_workspace/data"
          foreach ($file in "places.idx", "gazetteer.json.gz", "countries.json.gz") {
            if (-not (Test-Path "$data/$file")) { throw "the sidecar lacks data/$file" }
          }
          $version = & "$resources/native/exiftool/exiftool.exe" -ver
          if ($LASTEXITCODE -ne 0) { throw "the bundled ExifTool doesn't run" }
          "ExifTool $version"
          $catalog = Join-Path $env:RUNNER_TEMP "smoke.afcatalog"
          $summary = & "$resources/sidecar/media-workspace/media-workspace.exe" --catalog $catalog summary
          if ($LASTEXITCODE -ne 0) { throw "the packaged sidecar failed" }
          "sidecar summary: $(($summary | ConvertFrom-Json | ConvertTo-Json -Compress))"
          foreach ($file in "ffmpeg.exe", "ffprobe.exe") {
            if (-not (Test-Path "$resources/native/ffmpeg/$file")) { throw "the installer lacks native/ffmpeg/$file" }
          }
          $ffmpeg = & "$resources/native/ffmpeg/ffmpeg.exe" -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw "the bundled FFmpeg doesn't run" }
          "FFmpeg: $($ffmpeg[0])"
          $env:FFMPEG_PATH = (Resolve-Path "$resources/native/ffmpeg").Path
          $clip = (Resolve-Path "../e2e/fixtures/test-videos/z-sample-video.mp4").Path
          $probe = & "$resources/sidecar/media-workspace/media-workspace.exe" --catalog $catalog video-tool probe $clip | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $probe.width -ne 3840) { throw "the packaged sidecar can't read a video with the bundled FFmpeg" }
          "video probe: $($probe | ConvertTo-Json -Compress)"
          Get-ChildItem *.exe | ForEach-Object { "$($_.Name): $([math]::Round($_.Length / 1MB)) MB" }
      - name: Check that the packaged app starts
        shell: pwsh
        working-directory: apps/desktop/release
        run: |
          # Its own profile and no catalog: the welcome screen. A started app
          # has its GPU and renderer processes; one stuck before its window
          # has none.
          $env:AFTERFRAME_USER_DATA = Join-Path $env:RUNNER_TEMP "smoke-profile"
          $env:AFTERFRAME_NO_DEFAULT_CATALOG = "1"
          $app = Start-Process -FilePath "win-unpacked/AfterFrame.exe" -PassThru
          Start-Sleep -Seconds 20
          $children = @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$($app.Id)")
          "children: $($children.Count) ($(($children | ForEach-Object { $_.Name }) -join ', '))"
          taskkill /PID $app.Id /T /F | Out-Null
          if ($children.Count -eq 0) { throw "the packaged app did not get past startup" }
      - name: Keep the installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AfterFrame-windows-${{ github.sha }}
          path: apps/desktop/release/*.exe
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AfterFrame-windows-${{ github.sha }}
          path: installer
      - name: Add the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l installer
          # The Mac build and notarization can take a while; wait up to 90 min.
          for attempt in $(seq 1 90); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release upload "$TAG" installer/*.exe --repo "$GITHUB_REPOSITORY" --clobber
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
              exit 0
            fi
            echo "No release $TAG yet ($attempt/90), waiting for the Mac side"
            sleep 60
          done
          echo "::error::No GitHub Release $TAG after 90 minutes. Publish it with release.sh on the Mac, then re-run this job."
          exit 1
