name: E2E (full, nightly)

# quality.yml runs the CI-stable subset of the Electron suite on every PR.
# The other half — map (WebGL), lightbox zoom, video (AVFoundation), watched
# dirs (fs-watch timing), save/people flows (slow I/O) — only ran when someone
# remembered `npm run e2e:only` locally. This runs ALL of it once a night and
# on demand, so a regression in the excluded half surfaces within a day
# instead of at the next release. Informational: it is not a merge gate.
#
# It is also the coverage run: the renderer is an istanbul build, the main
# process and the Python sidecar collect on the side (scripts/e2e-coverage.mjs,
# docs/review/2026-09-17-E2E覆盖率.md), and the HTML report is uploaded on
# every run — pass or fail.

on:
  schedule:
    - cron: "17 18 * * *"   # 02:17 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

jobs:
  electron-e2e-full:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/sidecar/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Python sidecar
        run: python -m pip install -e "services/sidecar[dev]"
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Build native tools
        run: npm run build:native --prefix apps/desktop
      - name: Run the full Electron E2E suite with coverage
        # Builds the instrumented renderer itself; reports even when a spec fails.
        run: npm run e2e:coverage --prefix apps/desktop -- --retries=1
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-report
          path: apps/desktop/.coverage/report/
          retention-days: 30
      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-nightly-failure
          path: apps/desktop/e2e/.artifacts/
          include-hidden-files: true
          retention-days: 14
