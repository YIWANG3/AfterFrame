[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-workspace-sidecar"
version = "0.1.0"
description = "Local-first asset graph, metadata cache, and reverse lookup sidecar"
requires-python = ">=3.11"
dependencies = [
    # Image preprocessing for LLM annotation (resize + JPEG re-encode).
    "Pillow>=10.0",
    # HEIC/HEIF decoding (iPhone photos) for annotation.
    "pillow-heif>=0.16",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

